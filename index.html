<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>卡周期</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="卡周期">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">

<style>
:root{
  --bg:#f2f3f7; --panel:#fff; --panel2:#eef0f5; --line:#e3e6ed;
  --text:#141720; --dim:#5d6472; --faint:#8c94a4;
  --accent:#2f6fe0;
  --ok:#1ea862; --warn:#d99514; --hot:#e8701f; --bad:#e0384a;
  --navbg:rgba(242,243,247,.86);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014; --panel:#171a21; --panel2:#1e222b; --line:#2b303b;
    --text:#e8eaf0; --dim:#98a0b0; --faint:#69707e;
    --accent:#5b95f5;
    --ok:#34c77b; --warn:#f5b544; --hot:#ff8a3d; --bad:#f4525c;
    --navbg:rgba(14,16,20,.86);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column; overflow:hidden;
  touch-action:manipulation;
}
@supports(height:100dvh){ html,body{height:100dvh} }

/* ---------- 顶栏 ---------- */
.nav{
  flex:none; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex; align-items:center; gap:12px;
  background:var(--navbg); backdrop-filter:saturate(180%) blur(18px);
  border-bottom:.5px solid var(--line); z-index:10;
}
.nav h1{font-size:20px;font-weight:680;letter-spacing:.3px;flex:1}
.nav .date{font-size:12px;color:var(--faint);font-weight:400;margin-top:1px}
.navbtn{
  flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--accent);
  color:#fff;font-size:23px;line-height:1;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;padding-bottom:2px;
}
.navbtn:active{opacity:.7}

/* ---------- 滚动区 ---------- */
.scroll{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain; padding:14px 16px 26px;
}
.inner{max-width:720px;margin:0 auto}

/* ---------- 底部标签栏 ---------- */
.tabbar{
  flex:none; display:flex; background:var(--navbg);
  backdrop-filter:saturate(180%) blur(18px);
  border-top:.5px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;border:0;background:none;padding:7px 0 5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--faint);font-family:inherit;font-size:10.5px;
}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 通用 ---------- */
.view{display:none}
.view.on{display:block}
.card{background:var(--panel);border-radius:15px;padding:15px;margin-bottom:11px;
  box-shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme: dark){ .card{box-shadow:none;border:1px solid var(--line)} }
.sec{font-size:12px;color:var(--faint);letter-spacing:.9px;margin:22px 4px 8px;font-weight:600}
.sec:first-child{margin-top:2px}
.empty{color:var(--faint);text-align:center;padding:30px 14px;font-size:14px;line-height:1.9}

.btn{
  border:0;border-radius:11px;padding:12px 16px;font-family:inherit;font-size:15px;
  font-weight:600;cursor:pointer;background:var(--accent);color:#fff;
}
.btn:active{opacity:.75}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.sm{padding:8px 13px;font-size:13.5px;font-weight:550;border-radius:9px}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--line)}
.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

label{display:block;font-size:12.5px;color:var(--dim);margin:13px 0 5px;font-weight:550}
input,select,textarea{
  width:100%;background:var(--panel2);border:1px solid transparent;border-radius:10px;
  padding:11px 12px;color:var(--text);font-family:inherit;font-size:16px;
  -webkit-appearance:none;appearance:none;
}
select{background-image:none}
textarea{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

/* ---------- 卡片 ---------- */
.cc{position:relative;overflow:hidden;padding-left:18px}
.cc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar)}
.cc.s-ok{--bar:var(--ok)}.cc.s-warn{--bar:var(--warn)}
.cc.s-hot{--bar:var(--hot)}.cc.s-bad{--bar:var(--bad)}.cc.s-idle{--bar:var(--line)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}
.cc-name{font-size:15.5px;font-weight:620;line-height:1.3}
.cc-name .who{color:var(--dim);font-weight:400;font-size:12.5px;margin-left:5px}
.cc-meta{font-size:12px;color:var(--faint);margin-top:3px}
.pill{font-size:11px;font-weight:640;padding:4px 9px;border-radius:20px;white-space:nowrap;
  background:color-mix(in srgb,var(--bar) 15%,transparent);color:var(--bar)}
.cc.s-idle .pill{color:var(--dim)}
.cc-body{margin-top:11px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.amt{font-size:26px;font-weight:660;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.amt small{font-size:13px;font-weight:500;color:var(--dim);margin-left:3px}
.cd{font-size:13px;color:var(--dim)}
.cd b{color:var(--bar);font-size:16px;font-variant-numeric:tabular-nums}
.track{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:12px}
.fill{height:100%;background:var(--bar);border-radius:3px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:5px}
.note{font-size:12.5px;color:var(--faint);margin-top:8px;line-height:1.6}
.note.alert{color:var(--bad)}
.acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}

/* ---------- 列表行 ---------- */
.tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:.5px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx-l{flex:1;min-width:0}
.tx-t{font-size:14.5px;font-variant-numeric:tabular-nums}
.tx-s{font-size:12px;color:var(--faint);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:3px 7px;border-radius:5px;background:var(--panel2);
  color:var(--dim);white-space:nowrap}
.tag.paid{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:.5px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--dim)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.tip{font-size:12px;color:var(--faint);line-height:1.75;margin-top:9px}
.banner{background:color-mix(in srgb,var(--warn) 13%,var(--panel));
  border-left:4px solid var(--warn);font-size:13px;line-height:1.6}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;
  display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.modal{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;
  padding:8px 17px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){ .mask{align-items:center} .modal{border-radius:18px;max-height:86vh} }
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.modal h3{font-size:18px;font-weight:660}
.modal .hint{font-size:12.5px;color:var(--faint);margin-top:4px;line-height:1.6}
.macts{display:flex;gap:9px;margin-top:19px}
.macts .btn{flex:1}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.chip{padding:9px 12px;border-radius:10px;background:var(--panel2);
  font-size:13.5px;cursor:pointer;line-height:1.35;border:1.5px solid transparent}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{display:block;font-size:10.5px;opacity:.72;margin-top:1px}
</style>
</head>
<body>

<div class="nav">
  <div class="grow"><h1>卡周期</h1><div class="date" id="dateLine"></div></div>
  <button class="navbtn" onclick="openSwipe()" aria-label="记一笔">＋</button>
</div>

<div class="scroll" id="scroll"><div class="inner">
  <div class="view on" id="v-dash"></div>
  <div class="view" id="v-hist"></div>
  <div class="view" id="v-pos"></div>
  <div class="view" id="v-set"></div>
</div></div>

<div class="tabbar" id="tabbar">
  <button class="on" data-v="dash"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19"/></svg>概览</button>
  <button data-v="hist"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.6" cy="6" r="1.2"/><circle cx="3.6" cy="12" r="1.2"/><circle cx="3.6" cy="18" r="1.2"/></svg>流水</button>
  <button data-v="pos"><svg viewBox="0 0 24 24"><rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/><path d="M8.5 7h7M8.5 11h7"/><circle cx="12" cy="17" r="1.5"/></svg>商户</button>
  <button data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.2v2.6M12 19.2v2.6M4.7 4.7l1.9 1.9M17.4 17.4l1.9 1.9M2.2 12h2.6M19.2 12h2.6M4.7 19.3l1.9-1.9M17.4 6.6l1.9-1.9"/></svg>设置</button>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script src="core.js"></script>
<script>
/* =====================================================================
   核心逻辑来自 core.js（网页/小程序/测试共用），这里只做适配：
   把本页的全局状态 S 注入 calc/bufOf，UI 代码的调用形式保持不变。
   ===================================================================== */
const { pd, fd, md, addD, diffD, nextStmt, prevStmt, money, today } = CardCycleCore;
const calc  = (c, ref) => CardCycleCore.calc(c, S.txns, S.settings, ref);
const bufOf = c => CardCycleCore.bufOf(c, S.settings);

/* =====================================================================
   数据
   ===================================================================== */
const KEY='cardcycle.v1';
const DEF={people:[],cards:[],terminals:[],txns:[],
           settings:{buffer:3,minGap:7,lastBackup:null}};
let S=load();

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(!r) return structuredClone(DEF);
    const d=JSON.parse(r);
    const s=Object.assign(structuredClone(DEF),d);
    s.settings=Object.assign(structuredClone(DEF.settings),d.settings||{});
    return s;
  }catch(e){ return structuredClone(DEF); }
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ alert('保存失败：'+e.message+'\n\n请到「设置」导出备份，避免数据丢失。'); }
}
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---------- UI 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// 多人模式：默认关闭（单人使用，界面不出现「持卡人」概念）
const isMulti = () => S.settings.multiUser === true;

const personName=id=>{const p=S.people.find(p=>p.id===id);return p?p.name:'—';};
const cardLabel=c=>c.bank+(c.last4&&c.last4!=='****'?' ·'+c.last4:'');
const cardById=id=>S.cards.find(c=>c.id===id);
const termById=id=>S.terminals.find(t=>t.id===id);
function termLast(tid){const d=S.txns.filter(t=>t.terminalId===tid).map(t=>t.date).sort();return d.pop()||null;}
function termLastFor(tid,cid){const d=S.txns.filter(t=>t.terminalId===tid&&t.cardId===cid).map(t=>t.date).sort();return d.pop()||null;}

/* =====================================================================
   概览
   ===================================================================== */
const RANK={bad:0,hot:1,warn:2,ok:3,idle:4};
function renderDash(){
  const el=document.getElementById('v-dash');
  if(!S.cards.length){
    el.innerHTML='<div class="card"><div class="empty">还没有信用卡。<br>去「设置」添加，或粘贴导入已有数据。</div>'
      +'<button class="btn full" onclick="go(\'set\')">去设置</button></div>';
    return;
  }
  const list=S.cards.map(c=>({c,k:calc(c)}))
    .sort((a,b)=>RANK[a.k.st]-RANK[b.k.st]||a.k.toDue-b.k.toDue);
  let h='';

  // 备份提醒
  const lb=S.settings.lastBackup;
  const stale=S.txns.length>0 && (!lb || diffD(pd(lb),today())>30);
  if(stale) h+='<div class="card banner">'+(lb?'距上次备份已 '+diffD(pd(lb),today())+' 天。':'还没有备份过数据。')
    +'数据只存在这台手机上，建议现在导出一份。 <a href="#" onclick="go(\'set\');return false" style="color:var(--accent)">去备份</a></div>';

  const urgent=list.filter(x=>['bad','hot','warn'].includes(x.k.st));
  if(urgent.length){
    const sum=urgent.reduce((s,x)=>s+x.k.cur+x.k.over,0);
    h+='<div class="card" style="box-shadow:inset 0 0 0 1.5px var(--hot)"><div class="row">'
      +'<div class="grow"><div style="font-size:12.5px;color:var(--dim)">近期需要还款</div>'
      +'<div class="amt" style="margin-top:3px">¥'+money(sum)+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:12.5px;color:var(--dim)">涉及</div>'
      +'<div class="amt" style="margin-top:3px">'+urgent.length+'<small>张卡</small></div>'
      +'</div></div></div>';
  }
  el.innerHTML=h+list.map(x=>cardHTML(x.c,x.k)).join('');
}
function cardHTML(c,k){
  const head='<div class="cc-top"><div><div class="cc-name">'+esc(cardLabel(c))
    +(isMulti()?'<span class="who">'+esc(personName(c.personId))+'</span>':'')+'</div>'
    +'<div class="cc-meta">账单日 '+c.statementDay+' 号 · 提前 '+bufOf(c)+' 天还'
    +(c.limit?' · 额度 ¥'+money(c.limit):'')+'</div></div>'
    +'<div class="pill">'+k.label+'</div></div>';

  // 本期没刷过的卡收成一行，避免 7 张卡把概览页撑得太长
  if(k.st==='idle'){
    const soon=k.toDue<=0;   // 已过安全窗口：现在刷会计入即将出的账单
    const line = soon ? '窗口已过 · '+md(addD(k.anchor,1))+' 起再刷'
                      : '可刷至 '+md(addD(k.due,-1))+' · '+md(k.due)+' 前还清';
    return '<div class="card cc s-idle" style="padding-top:13px;padding-bottom:13px">'+head
      +'<div class="row" style="margin-top:10px">'
      +'<div class="grow" style="font-size:12.5px;color:'+(soon?'var(--hot)':'var(--faint)')+'">'+line+'</div>'
      +'<button class="btn sm ghost" onclick="openSwipe(\''+c.id+'\')">记消费</button></div></div>';
  }

  const amt=k.cur+k.over;
  const cd = k.toDue>=0 ? '<span class="cd">距还款截止 <b>'+k.toDue+'</b> 天</span>'
                        : '<span class="cd">距账单日 <b>'+k.toAnchor+'</b> 天</span>';
  return '<div class="card cc s-'+k.st+'">'+head
    +'<div class="cc-body"><div class="amt">¥'+money(amt)+'<small>待还</small></div>'+cd+'</div>'
    +'<div class="track"><div class="fill" style="width:'+k.pct+'%"></div></div>'
    +'<div class="ticks"><span>'+md(k.winStart)+' 起可刷</span><span>'+md(k.due)+' 前还清</span></div>'
    +'<div class="note'+(k.st==='bad'?' alert':'')+'">'+esc(k.hint)+'</div>'
    +'<div class="acts"><button class="btn sm" onclick="openSwipe(\''+c.id+'\')">记消费</button>'
    +'<button class="btn sm ghost" onclick="openRepay(\''+c.id+'\')">登记还款</button>'
    +'<button class="btn sm ghost" onclick="go(\'hist\',\''+c.id+'\')">明细</button></div></div>';
}

/* =====================================================================
   流水
   ===================================================================== */
let histFilter='';
function renderHist(){
  const el=document.getElementById('v-hist');
  let h='<div class="card"><select onchange="histFilter=this.value;renderHist()">'
    +'<option value="">全部信用卡</option>'
    +S.cards.map(c=>'<option value="'+c.id+'"'+(histFilter===c.id?' selected':'')+'>'
      +esc((isMulti()?personName(c.personId)+' · ':'')+cardLabel(c))+'</option>').join('')+'</select></div>';
  const rows=S.txns.filter(t=>!histFilter||t.cardId===histFilter)
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  if(!rows.length){ el.innerHTML=h+'<div class="card"><div class="empty">还没有刷卡记录。</div></div>'; return; }
  const tot=rows.reduce((s,t)=>s+t.amount,0), un=rows.filter(t=>!t.repaid).reduce((s,t)=>s+t.amount,0);
  h+='<div class="card"><div class="kv"><span>记录笔数</span><b>'+rows.length+' 笔</b></div>'
    +'<div class="kv"><span>累计刷卡</span><b>¥'+money(tot)+'</b></div>'
    +'<div class="kv"><span>其中未还</span><b style="color:var(--hot)">¥'+money(un)+'</b></div></div>';
  h+='<div class="card">'+rows.map(t=>{
    const c=cardById(t.cardId),tm=termById(t.terminalId);
    const sub=[c?(isMulti()?personName(c.personId)+' · ':'')+cardLabel(c):'已删除的卡',
               tm?tm.name:'未记商户',t.note].filter(Boolean).join(' · ');
    return '<div class="tx"><div class="tx-l"><div class="tx-t">'+t.date+' &nbsp;¥'+money(t.amount)+'</div>'
      +'<div class="tx-s">'+esc(sub)+'</div></div>'
      +(t.repaid?'<span class="tag paid">已还</span>':'<span class="tag">未还</span>')
      +'<button class="btn sm ghost" onclick="toggleTx(\''+t.id+'\')">'+(t.repaid?'撤销':'标已还')+'</button>'
      +'<button class="btn sm danger" onclick="delTx(\''+t.id+'\')">删</button></div>';
  }).join('')+'</div>';
  el.innerHTML=h;
}
function toggleTx(id){
  const t=S.txns.find(x=>x.id===id); if(!t) return;
  t.repaid=!t.repaid; t.repaidDate=t.repaid?fd(today()):null;
  save(); renderAll();
}
function delTx(id){
  if(!confirm('删除这条记录？')) return;
  S.txns=S.txns.filter(x=>x.id!==id); save(); renderAll();
}

/* =====================================================================
   商户
   ===================================================================== */
function renderPos(){
  const el=document.getElementById('v-pos');
  if(!S.terminals.length){
    el.innerHTML='<div class="card"><div class="empty">还没有常用商户。<br>去「设置」添加。</div></div>'; return;
  }
  const t0=today(), mg=S.settings.minGap||7, mk=fd(t0).slice(0,7);
  const rows=S.terminals.map(tm=>{
    const l=termLast(tm.id);
    return {tm,l,g:l?diffD(pd(l),t0):9999,
            n:S.txns.filter(t=>t.terminalId===tm.id&&t.date.slice(0,7)===mk).length};
  }).sort((a,b)=>b.g-a.g);

  let h='<div class="card"><div class="sec" style="margin:0 0 4px">按闲置时间排序</div>'
    +rows.map(r=>{
      const col=r.g>=mg?'var(--ok)':(r.g>=Math.ceil(mg/2)?'var(--warn)':'var(--bad)');
      return '<div class="tx"><span class="dot" style="background:'+col+'"></span>'
        +'<div class="tx-l"><div class="tx-t">'+esc(r.tm.name)+'</div>'
        +'<div class="tx-s">'+(r.l?'上次 '+r.l:'未使用过')+' · 本月 '+r.n+' 笔'
        +(r.tm.note?' · '+esc(r.tm.note):'')+'</div></div>'
        +'<div style="text-align:right;font-size:11.5px;color:var(--dim)">'
        +'<b style="display:block;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums">'
        +(r.g===9999?'—':r.g)+'</b>天未用</div></div>';
    }).join('')+'</div>';

  h+='<div class="card"><div class="sec" style="margin:0 0 6px">卡 × 商户 · 上次消费</div>';
  if(!S.cards.length) h+='<div class="empty">还没有信用卡。</div>';
  else{
    h+='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">'
      +'<table style="width:100%;border-collapse:collapse;font-size:12px">'
      +'<tr><th style="text-align:left;padding:6px 8px 6px 0;color:var(--faint);font-weight:500">卡</th>'
      +S.terminals.map(t=>'<th style="padding:6px 7px;color:var(--faint);font-weight:500;white-space:nowrap">'+esc(t.name)+'</th>').join('')+'</tr>'
      +S.cards.map(c=>'<tr><td style="padding:8px 8px 8px 0;border-top:.5px solid var(--line);white-space:nowrap">'
        +esc(cardLabel(c))+'</td>'
        +S.terminals.map(tm=>{
            const l=termLastFor(tm.id,c.id), g=l?diffD(pd(l),t0):null;
            const col=g===null?'var(--faint)':(g>=mg?'var(--ok)':'var(--hot)');
            return '<td style="padding:8px 7px;border-top:.5px solid var(--line);text-align:center;color:'
              +col+';font-variant-numeric:tabular-nums">'+(g===null?'—':g+'天')+'</td>';
          }).join('')+'</tr>').join('')+'</table></div>';
  }
  h+='<div class="tip">数字＝距上次「这张卡在这家商户」消费的天数。绿色表示已超过设定的 '+mg+' 天。</div></div>';
  el.innerHTML=h;
}

    +(S.cards.length?S.cards.slice().sort((a,b)=>a.statementDay-b.statementDay).map(c=>{

        return '<div class="tx"><div class="tx-l"><div class="tx-t">'+esc(cardLabel(c))+'</div>'
        +'<div class="tx-s">账单日 '+c.statementDay+' 号 → 提醒 '+d.getDate()+' 号（提前 '+bufOf(c)+' 天）'
        +(isMulti()?' · '+esc(personName(c.personId)):'')+'</div></div>'
        +'<button class="btn sm ghost" onclick="openCard(\''+c.id+'\')">改</button>'
        +'<button class="btn sm danger" onclick="delCard(\''+c.id+'\')">删</button></div>';
      }).join(''):'<div class="empty" style="padding:14px">还没有信用卡</div>')
    +'<button class="btn ghost full" style="margin-top:11px" onclick="openCard()">＋ 添加信用卡</button></div>';

  h+='<div class="sec">常用商户</div><div class="card">'
    +(S.terminals.length?S.terminals.map(t=>
        '<div class="tx"><div class="tx-l"><div class="tx-t">'+esc(t.name)+'</div>'
        +'<div class="tx-s">'+S.txns.filter(x=>x.terminalId===t.id).length+' 笔记录</div></div>'
        +'<button class="btn sm danger" onclick="delTerm(\''+t.id+'\')">删</button></div>'

    +'<div><div style="font-size:14px;font-weight:550">多人管理</div>'
    +'<div class="tip" style="margin-top:2px">为朋友代管卡片时开启，界面会出现「持卡人」。<br>默认关闭：只管自己的卡，界面更干净。</div></div>'

    +'<label>同商户同卡最小间隔（天）</label>'
    +'<input type="number" min="0" max="60" value="'+(S.settings.minGap||7)+'" onchange="setGap(this.value)">'
    +'<div class="tip">只影响「商户」页的绿灯/红灯判断，不限制记录。</div></div>';

  h = h.replace('<div class="sec">常用商户</div>', paramBlock+'<div class="sec">常用商户</div>');

  if(isMulti()){
    h+='<div class="sec">持卡人</div><div class="card">'
      +S.people.map(p=>'<div class="tx"><div class="tx-l"><div class="tx-t">'+esc(p.name)+'</div>'
        +'<div class="tx-s">'+S.cards.filter(c=>c.personId===p.id).length+' 张卡</div></div>'
        +'<button class="btn sm danger" onclick="delPerson(\''+p.id+'\')">删</button></div>').join('')
      +'<div class="row" style="margin-top:11px"><input id="npName" placeholder="姓名，如 我 / 老张">'

    +'<button class="btn full" style="margin-top:12px" onclick="exportICS()">导出日历提醒（.ics）</button>'
    +'<div class="tip">每张卡每月两条提醒：<b>新周期开始</b>（账单日次日）和 <b>该还款</b>（各自的提醒日，'

    +'换机、清理浏览器、或长期不打开都可能丢，请定期备份。</div>'
    +'<div class="row" style="margin-top:12px"><button class="btn ghost grow" onclick="openExport()">复制/导出</button>'
    +'<button class="btn ghost grow" onclick="openImport()">粘贴/导入</button></div>'
    +'<div class="tip">'+(S.settings.lastBackup?'上次备份：'+S.settings.lastBackup:'还没有备份过')
    +' · 存储状态：<span id="persistState">检测中…</span></div>'
    +'<button class="btn danger full" style="margin-top:14px" onclick="wipe()">清空全部数据</button>'
    +'<div class="tip">删除本机记录的全部信用卡、商户和消费流水，仅影响这台设备，无法恢复。清空前请先导出备份。</div></div>';

  el.innerHTML=h;
  showPersist();
}
// 单人模式的隐形持卡人：保证卡片始终有归属，但界面不出现这个概念
function ensureMe(){
  if(!S.people.length) S.people.push({id:uid(),name:'我'});
  return S.people[0].id;
}
function toggleMulti(){
  if(isMulti()){
    if(S.people.length>1){
      alert('目前有 '+S.people.length+' 个持卡人。请先把卡片都归到一个人名下并删除其余持卡人，再关闭多人管理。');
      return;
    }
    S.settings.multiUser=false;
  }else{
    S.settings.multiUser=true;
    ensureMe();
  }
  save();renderAll();
}
function addPerson(){const v=document.getElementById('npName').value.trim();if(!v)return;
  S.people.push({id:uid(),name:v});save();renderAll();}
function delPerson(id){
  const n=S.cards.filter(c=>c.personId===id).length;
  if(!confirm(n?'此人名下 '+n+' 张卡将一并删除，确定？':'删除这个持卡人？'))return;
  S.cards.filter(c=>c.personId===id).forEach(c=>S.txns=S.txns.filter(t=>t.cardId!==c.id));
  S.cards=S.cards.filter(c=>c.personId!==id);
  S.people=S.people.filter(p=>p.id!==id); save(); renderAll();
}
function addTerm(){const v=document.getElementById('ntName').value.trim();if(!v)return;
  S.terminals.push({id:uid(),name:v,note:''});save();renderAll();}
function delTerm(id){if(!confirm('删除这个商户？'))return;
  S.terminals=S.terminals.filter(t=>t.id!==id);save();renderAll();}
function delCard(id){
  const n=S.txns.filter(t=>t.cardId===id).length;
  if(!confirm('删除这张卡'+(n?'及其 '+n+' 条记录':'')+'？'))return;
  S.txns=S.txns.filter(t=>t.cardId!==id);
  S.cards=S.cards.filter(c=>c.id!==id);save();renderAll();
}
function setBuffer(v){S.settings.buffer=Math.max(0,Math.min(10,+v||0));save();renderAll();}
function setGap(v){S.settings.minGap=Math.max(0,Math.min(60,+v||0));save();renderAll();}

/* =====================================================================
   弹窗
   ===================================================================== */
function showModal(h){
  document.getElementById('modal').innerHTML='<div class="grab"></div>'+h;
  document.getElementById('mask').classList.add('on');
}
function closeModal(){document.getElementById('mask').classList.remove('on');}
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal();});

/* ---- 信用卡 ---- */
function openCard(id){
  if(isMulti() && !S.people.length){alert('请先添加一个持卡人。');return;}
  const c=id?cardById(id):null;
  const b=c?bufOf(c):(S.settings.buffer||3);
  showModal('<h3>'+(c?'编辑信用卡':'添加信用卡')+'</h3>'
    +(isMulti()
      ? '<label>持卡人</label><select id="fPerson">'
        +S.people.map(p=>'<option value="'+p.id+'"'+(c&&c.personId===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>'
      : '')
    +'<div class="two"><div><label>银行</label><input id="fBank" value="'+(c?esc(c.bank):'')+'" placeholder="广发银行"></div>'
    +'<div><label>卡号后四位（选填）</label><input id="fLast4" value="'+(c&&c.last4!=='****'?esc(c.last4):'')+'" maxlength="4" inputmode="numeric" placeholder="1234"></div></div>'
    +'<div class="two"><div><label>账单日（每月几号）</label>'
    +'<input id="fStmt" type="number" min="1" max="31" inputmode="numeric" value="'+(c?c.statementDay:'')+'" placeholder="10" oninput="prevDue()"></div>'
    +'<div><label>提前几天还款</label>'
    +'<input id="fBuf" type="number" min="0" max="15" inputmode="numeric" value="'+b+'" oninput="prevDue()"></div></div>'
    +'<div class="hint" id="duePrev" style="margin-top:8px"></div>'
    +'<label>额度（选填）</label><input id="fLimit" type="number" inputmode="numeric" value="'+(c&&c.limit?c.limit:'')+'" placeholder="50000">'
    +'<div class="macts"><button class="btn ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn" onclick="saveCard('+(id?"'"+id+"'":'null')+')">保存</button></div>');
  prevDue();
}
function prevDue(){
  const s=+document.getElementById('fStmt').value, b=+document.getElementById('fBuf').value;
  const el=document.getElementById('duePrev'); if(!el) return;
  if(s>=1&&s<=31&&b>=0){
    const a=nextStmt(s,today()), d=addD(a,-b);
    el.innerHTML='下次提醒还款：<b style="color:var(--accent)">'+md(d)+'</b>'
      +'（账单日 '+md(a)+' 前 '+b+' 天）';
  } else el.textContent='填好账单日和提前天数后，这里会显示提醒日。';
}
function saveCard(id){
  const bank=document.getElementById('fBank').value.trim();
  const stmt=+document.getElementById('fStmt').value;
  const buf=+document.getElementById('fBuf').value;
  if(!bank){alert('请填银行名称');return;}
  if(!(stmt>=1&&stmt<=31)){alert('账单日填 1–31');return;}
  if(!(buf>=0&&buf<=15)){alert('提前天数填 0–15');return;}
  const pEl=document.getElementById('fPerson');
  const data={personId:pEl?pEl.value:ensureMe(),bank,
    last4:document.getElementById('fLast4').value.trim()||'****',
    statementDay:stmt,buffer:buf,limit:+document.getElementById('fLimit').value||0};
  if(id) Object.assign(cardById(id),data);
  else S.cards.push(Object.assign({id:uid()},data));
  save();closeModal();renderAll();
}

/* ---- 记一笔 ---- */
let swipeCard='',swipeTerm='';
function openSwipe(cid){
  if(!S.cards.length){alert('请先到「设置」添加信用卡。');return;}
  swipeCard=cid||S.cards[0].id;
  swipeTerm=S.terminals.length
    ? S.terminals.map(t=>({id:t.id,g:termLast(t.id)?diffD(pd(termLast(t.id)),today()):9999}))
        .sort((a,b)=>b.g-a.g)[0].id : '';
  drawSwipe();
}
function drawSwipe(){
  const k=calc(cardById(swipeCard)),t0=today();
  let warn='';
  if(k.toDue<=0) warn='<div class="hint" style="color:var(--bad)">注意：本期安全窗口已过（'
    +(k.toAnchor===0?'今天就是账单日':'距账单日只剩 '+k.toAnchor+' 天')
    +'），现在刷会计入 '+md(k.anchor)+' 的账单。建议等 '+md(addD(k.anchor,1))+' 起再刷。</div>';
  else if(k.toDue<=1) warn='<div class="hint" style="color:var(--hot)">注意：本期还款截止 '+md(k.due)+'，现在刷的钱也要在那之前还清。</div>';
  showModal('<h3>记一笔消费</h3><div class="hint">周期归属按账单日自动计算。</div>'
    +'<label>用哪张卡</label><div class="chips">'
    +S.cards.map(c=>{const kk=calc(c);
      return '<div class="chip'+(c.id===swipeCard?' on':'')+'" onclick="swipeCard=\''+c.id+'\';drawSwipe()">'
        +esc(cardLabel(c))+'<small>'+kk.label+'</small></div>';}).join('')+'</div>'
    +(S.terminals.length
      ?'<label>在哪个商户 <span style="color:var(--faint);font-weight:400">· 已按闲置排序</span></label><div class="chips">'
       +S.terminals.map(tm=>({tm,
           g:termLastFor(tm.id,swipeCard)?diffD(pd(termLastFor(tm.id,swipeCard)),t0):null,
           ga:termLast(tm.id)?diffD(pd(termLast(tm.id)),t0):9999}))
         .sort((a,b)=>b.ga-a.ga)
         .map(o=>'<div class="chip'+(o.tm.id===swipeTerm?' on':'')+'" onclick="swipeTerm=\''+o.tm.id+'\';drawSwipe()">'
           +esc(o.tm.name)+'<small>'+(o.g===null?'本卡未用过':'本卡 '+o.g+' 天前')+'</small></div>').join('')+'</div>'
      :'<div class="hint" style="margin-top:12px">还没添加商户，可以先只记金额。</div>')
    +'<div class="two"><div><label>金额</label><input id="sAmt" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>'
    +'<div><label>日期</label><input id="sDate" type="date" value="'+fd(t0)+'"></div></div>'
    +'<label>备注（选填）</label><input id="sNote">'+warn
    +'<div class="macts"><button class="btn ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn" onclick="saveSwipe()">保存</button></div>');
}
function saveSwipe(){
  const a=+document.getElementById('sAmt').value;
  if(!(a>0)){alert('请填写金额');return;}
  const dt=document.getElementById('sDate').value||fd(today());
  if(dt>fd(today()) && !confirm(dt+' 是未来的日期，确定这样记录吗？')) return;
  S.txns.push({id:uid(),cardId:swipeCard,terminalId:swipeTerm,
    date:dt,amount:a,
    note:document.getElementById('sNote').value.trim(),repaid:false,repaidDate:null});
  save();closeModal();go('dash');
}

/* ---- 还款 ---- */
function openRepay(cid){
  const c=cardById(cid),k=calc(c);
  const rows=S.txns.filter(t=>t.cardId===cid&&!t.repaid).sort((a,b)=>a.date.localeCompare(b.date));
  showModal('<h3>登记还款</h3><div class="hint">'+esc(cardLabel(c))+' · 待还 ¥'+money(k.cur+k.over)+'</div>'
    +'<div style="margin-top:12px">'+rows.map(t=>{const tm=termById(t.terminalId);
      return '<div class="tx"><div class="tx-l"><div class="tx-t">'+t.date+' &nbsp;¥'+money(t.amount)+'</div>'
        +'<div class="tx-s">'+esc(tm?tm.name:'未记商户')+'</div></div>'
        +'<button class="btn sm ghost" onclick="toggleTx(\''+t.id+'\');openRepay(\''+cid+'\')">已还</button></div>';
      }).join('')+'</div>'
    +'<div class="macts"><button class="btn ghost" onclick="closeModal()">关闭</button>'
    +'<button class="btn" onclick="repayAll(\''+cid+'\')">全部标记已还</button></div>');
}
function repayAll(cid){
  const d=fd(today());
  S.txns.filter(t=>t.cardId===cid&&!t.repaid).forEach(t=>{t.repaid=true;t.repaidDate=d;});
  save();closeModal();renderAll();
}

/* =====================================================================
   日历导出（生成逻辑在 core.js 的 buildICS，这里只负责下载与提示）

function exportICS(){
  if(!S.cards.length){alert('还没有信用卡。');return;}
  const r = CardCycleCore.buildICS(S.cards, S.people, S.settings,
                                   {months:12, multiUser:isMulti()});
  dl(new Blob([r.text],{type:'text/calendar;charset=utf-8'}),'卡周期提醒.ics');
  setTimeout(()=>alert('已生成 '+r.count+' 条提醒，覆盖未来 12 个月。\n\niPhone：选「存储到文件」，'
    +'然后到文件 App 里点开它，选择加入日历。\n\n建议放进单独的日历分组，下次重新导出前先删掉旧的。'),400);
}

/* =====================================================================
   备份：复制 / 粘贴
   ===================================================================== */
function dl(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},200);
}
function markBackup(){S.settings.lastBackup=fd(today());save();}

function openExport(){
  const txt=JSON.stringify(S);
  showModal('<h3>导出备份</h3>'
    +'<div class="hint">把下面这段文字复制走，存到备忘录、微信收藏或邮件里。'
    +'换手机时用「粘贴/导入」贴回来即可。</div>'
    +'<textarea id="expBox" rows="7" readonly style="margin-top:12px">'+esc(txt)+'</textarea>'
    +'<div class="row" style="margin-top:10px">'
    +'<button class="btn grow" onclick="copyExp()">复制到剪贴板</button>'
    +'<button class="btn ghost grow" onclick="dlJSON()">存成文件</button></div>'
    +'<div id="copyMsg" class="hint" style="text-align:center;margin-top:9px"></div>'
    +'<div class="macts"><button class="btn ghost" onclick="closeModal()">关闭</button></div>');
}
async function copyExp(){
  const b=document.getElementById('expBox'), m=document.getElementById('copyMsg');
  try{
    await navigator.clipboard.writeText(b.value);
    m.textContent='✅ 已复制。请立刻粘贴到备忘录保存。'; markBackup();
  }catch(e){
    b.removeAttribute('readonly'); b.select(); b.setSelectionRange(0,999999);
    const ok=document.execCommand&&document.execCommand('copy');
    b.setAttribute('readonly','');
    m.textContent = ok ? '✅ 已复制。' : '请长按上面的文字框，全选后手动复制。';
    if(ok) markBackup();
  }
}
function dlJSON(){
  dl(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),'卡周期备份-'+fd(today())+'.json');
  markBackup(); renderAll();
}
function openImport(){
  showModal('<h3>导入备份</h3>'
    +'<div class="hint">把之前复制的那段文字粘贴到下面，点导入。<b>会覆盖当前全部数据。</b></div>'
    +'<textarea id="impBox" rows="7" placeholder="在这里长按粘贴…" style="margin-top:12px"></textarea>'
    +'<div class="row" style="margin-top:10px">'
    +'<button class="btn grow" onclick="doImport()">导入</button>'
    +'<button class="btn ghost grow" onclick="document.getElementById(\'fimp\').click()">从文件</button></div>'
    +'<input type="file" id="fimp" accept=".json,application/json,text/plain" style="display:none" onchange="fileImport(this)">'
    +'<div class="macts"><button class="btn ghost" onclick="closeModal()">取消</button></div>');
}
function applyImport(txt){
  let d;
  try{ d=JSON.parse(txt.trim()); }
  catch(e){ alert('内容不是有效的备份数据，请确认完整复制了全部文字。'); return false; }
  if(!d || !Array.isArray(d.cards)){ alert('这段数据里没有信用卡信息，可能不是本工具的备份。'); return false; }
  if(!confirm('将导入 '+d.cards.length+' 张卡、'+(d.txns||[]).length+' 条记录，覆盖当前数据。确定？')) return false;
  S=Object.assign(structuredClone(DEF),d);
  S.settings=Object.assign(structuredClone(DEF.settings),d.settings||{});
  if(S.people.length>1) S.settings.multiUser=true;   // 多人备份自动进多人模式
  save(); closeModal(); go('dash');
  alert('导入成功。'); return true;
}
function doImport(){ applyImport(document.getElementById('impBox').value); }
function fileImport(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{applyImport(r.result);inp.value='';};
  r.readAsText(f);
}
function wipe(){
  if(!confirm('将删除本机的 '+S.cards.length+' 张信用卡、'+S.terminals.length+' 个商户、'
    +S.txns.length+' 条消费记录，无法恢复。建议先导出备份。确定清空？'))return;
  if(!confirm('再确认一次：数据清空后无法找回，真的要清空？'))return;
  S=structuredClone(DEF);save();renderAll();
}

/* =====================================================================
   存储持久化（对抗 Safari 的自动清理）
   ===================================================================== */
async function askPersist(){
  try{
    if(navigator.storage && navigator.storage.persist){
      if(!(await navigator.storage.persisted())) await navigator.storage.persist();
      return await navigator.storage.persisted();
    }
  }catch(e){}
  return null;
}
async function showPersist(){
  const el=document.getElementById('persistState'); if(!el) return;
  const p=await askPersist();
  const standalone = window.navigator.standalone===true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if(p===true) el.innerHTML='<b style="color:var(--ok)">已持久化</b>';
  else if(p===false) el.innerHTML='<b style="color:var(--warn)">未持久化</b>'
    + (standalone?'':'，建议「添加到主屏幕」');
  else el.textContent='此浏览器不支持检测';
}

/* =====================================================================
   启动
   ===================================================================== */
function go(v,arg){
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  if(v==='hist'&&arg!==undefined) histFilter=arg;
  renderAll();
  document.getElementById('scroll').scrollTop=0;
}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.v));

function renderAll(){
  const t=today();
  document.getElementById('dateLine').textContent =
    fd(t)+' 星期'+'日一二三四五六'[t.getDay()];
  renderDash();renderHist();renderPos();renderSet();
}

// 首次打开：一个隐形持卡人 + 四个占位商户（可改可删）
if(!localStorage.getItem(KEY)){
  S.people=[{id:uid(),name:'我'}];
  S.terminals=['商户 A','商户 B','商户 C','商户 D'].map(n=>({id:uid(),name:n,note:''}));
  save();
}
// 老数据迁移：已经有多个持卡人的，自动切到多人模式
if(S.people.length>1 && S.settings.multiUser!==true){ S.settings.multiUser=true; save(); }
renderAll();
askPersist();

// PWA 从后台切回前台时重算——否则隔夜打开显示的还是昨天的倒计时
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) renderAll(); });

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
